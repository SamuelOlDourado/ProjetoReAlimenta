<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReAlimenta - Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="realimenta-bg min-vh-100">
    {% set icone_svg = url_for('static', filename='img/icones-pixel.svg') %}
    <div class="scene-decor" aria-hidden="true"></div>

    <button type="button" class="btn-mudo" data-botao-mudo title="Silenciar som" aria-pressed="false">
        <span class="icone-som-on"><svg class="icone-pixel" aria-hidden="true"><use href="{{ icone_svg }}#sound-on"></use></svg></span>
        <span class="icone-som-off"><svg class="icone-pixel" aria-hidden="true"><use href="{{ icone_svg }}#sound-off"></use></svg></span>
    </button>

    <div class="container py-4 py-md-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-9 col-xl-8">

                <header class="quiz-header">
                    <div class="quiz-player">
                        <span class="player-icon"><img src="{{ url_for('static', filename='img/usuario.webp') }}" class="icone-pixel" alt="" aria-hidden="true"></span>
                        <span id="apelido-jogador">{{ apelido }}</span>
                    </div>
                    <div class="quiz-question-number" id="numero-pergunta">PERGUNTA 01/{{ '%02d' % total_perguntas }}</div>
                    <div class="quiz-score">
                        <span class="score-icon"><img src="{{ url_for('static', filename='img/estrela.webp') }}" class="icone-pixel" alt="" aria-hidden="true"></span>
                        <span id="pontuacao-atual">0</span> PTS
                    </div>
                </header>

                <div class="quiz-timer-row">
                    <span class="quiz-timer" id="tempo-restante">{{ tempo_total_partida }}s</span>
                    <div class="quiz-timer-bar">
                        <div class="quiz-timer-fill" id="barra-tempo" style="width: 100%;"></div>
                    </div>
                </div>

                <!-- Tela da pergunta -->
                <section id="tela-pergunta">
                    <div class="quiz-question" id="enunciado">
                        Carregando pergunta...
                    </div>

                    <div class="quiz-alternatives" id="alternativas">
                        <!-- alternativas inseridas via JavaScript -->
                    </div>
                </section>

                <!-- Feedback: acertou -->
                <section id="feedback-acerto" class="feedback-container feedback-correta d-none">
                    <div class="feedback-icone"><img src="{{ url_for('static', filename='img/trofeu.webp') }}" class="icone-pixel" alt="" aria-hidden="true"></div>
                    <h2 class="feedback-titulo titulo-acerto">VOCÊ ACERTOU!</h2>
                    <p class="feedback-pontos" id="pontos-ganhos">+100 PONTOS</p>
                    <p class="feedback-bonus-tempo d-none" id="bonus-tempo"></p>

                    <div class="feedback-dica">
                        <span class="dica-icone"><img src="{{ url_for('static', filename='img/lampada.webp') }}" class="icone-pixel" alt="" aria-hidden="true"></span>
                        <div>
                            <div class="dica-titulo">DICA SUSTENTÁVEL</div>
                            <div class="dica-texto" id="dica-acerto"></div>
                        </div>
                    </div>

                    <button type="button" class="btn-neon btn-neon-green btn-proxima" data-proxima>
                        PRÓXIMA PERGUNTA &gt;
                    </button>
                </section>

                <!-- Feedback: errou -->
                <section id="feedback-erro" class="feedback-container feedback-erro d-none">
                    <div class="feedback-icone icone-erro">✕</div>
                    <h2 class="feedback-titulo titulo-erro">OPS, VOCÊ ERROU!</h2>

                    <div class="row g-3 mb-3">
                        <div class="col-12 col-md-6">
                            <div class="feedback-explicacao feedback-explicacao-erro h-100">
                                <div class="explicacao-titulo">POR QUE NÃO É CORRETA?</div>
                                <div class="explicacao-texto" id="explicacao-erro"></div>
                            </div>
                        </div>
                        <div class="col-12 col-md-6">
                            <div class="feedback-explicacao feedback-explicacao-correta h-100">
                                <div class="explicacao-titulo">A RESPOSTA CORRETA É:</div>
                                <div class="alternativa-correta-texto" id="texto-resposta-correta"></div>
                                <div class="dica-texto-inline" id="dica-erro"></div>
                            </div>
                        </div>
                    </div>

                    <button type="button" class="btn-neon btn-neon-green btn-proxima" data-proxima>
                        PRÓXIMA PERGUNTA &gt;
                    </button>
                </section>

            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            totalPerguntas: {{ total_perguntas }},
            tempoTotalPartida: {{ tempo_total_partida }}
        };
    </script>
    <script src="{{ url_for('static', filename='js/sound.js') }}"></script>
    <script src="{{ url_for('static', filename='js/quiz.js') }}"></script>
</body>
</html>
